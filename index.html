<body>
<canvas id="game"></canvas>
<script>
"use strict";

/* =========================================================================
 * Doodle Jump – nur besser
 * Ein komplettes Doodle-Jump-Spiel in einer Datei, mit zwei Designs:
 *   "classic"  – Karopapier-Look wie das Original
 *   "space"    – Weltraum-Design mit Leucht-Plattformen und Alien
 * Gesteuert wird auf dem Handy durch Kippen (DeviceOrientation),
 * am Rechner mit Pfeiltasten / A / D. Falls kein Neigungssensor
 * verfügbar ist, greift automatisch die Touch-Steuerung.
 * ========================================================================= */

/* ------------------------------ Konstanten ------------------------------ */

const LOGICAL_W   = 400;    // feste logische Spielfeldbreite
const MAX_CSS_W   = 520;    // maximale Darstellungsbreite auf großen Bildschirmen

const GRAVITY     = 1900;   // Schwerkraft in px/s²
const JUMP_VY     = -780;   // Sprungimpuls beim Landen auf einer Plattform
const SPRING_VY   = -1450;  // Sprungimpuls eines Trampolins
const MONSTER_VY  = -900;   // Abpraller beim Besiegen eines Monsters
const MOVE_MAX    = 340;    // maximale horizontale Geschwindigkeit
const MOVE_EASE   = 9;      // wie schnell vx der Eingabe folgt (pro Sekunde)
const FRICTION    = 6;      // horizontale Dämpfung ohne Eingabe

const JETPACK_TIME = 2.2;   // Flugdauer des Jetpacks in Sekunden
const JETPACK_VY   = -1250;

const PLATFORM_W  = 64;
const PLATFORM_H  = 17;

const HUD_H = 46;           // Höhe des Papierstreifens oben

const STATE = { START: 0, PLAYING: 1, PAUSED: 2, GAMEOVER: 3 };

const HAND = "'Patrick Hand','Comic Sans MS','Chalkboard SE','Marker Felt','Segoe Print',cursive";

const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const lerp  = (a, b, t)   => a + (b - a) * t;
const rand  = (a, b)      => a + Math.random() * (b - a);
// deterministisches Pseudo-Rauschen (für Abrisskanten, Sterne usw.)
const hash  = (n) => { const s = Math.sin(n * 12.9898) * 43758.5453; return s - Math.floor(s); };

/* Sicherer Speicher: fällt auf ein In-Memory-Objekt zurück, wenn
 * localStorage (z. B. in einer Sandbox) nicht verfügbar ist. */
const store = (() => {
  try {
    const s = window.localStorage;
    s.setItem("dj_test", "1"); s.removeItem("dj_test");
    return s;
  } catch (e) {
    const d = {};
    return { getItem: (k) => (k in d ? d[k] : null), setItem: (k, v) => { d[k] = String(v); } };
  }
})();

/* -------------------------------- Canvas -------------------------------- */

const canvas = document.getElementById("game");
const ctx    = canvas.getContext("2d");

let viewH = 600;            // logische Höhe (abhängig vom Fenster)
let scale = 1;              // Skalierung logisch -> Gerätepixel
let nowSec = 0;             // Uhr für Animationen (Sekunden)

function resize() {
  const cssW = Math.min(window.innerWidth, MAX_CSS_W);
  const cssH = window.innerHeight;
  const dpr  = window.devicePixelRatio || 1;

  canvas.style.width  = cssW + "px";
  canvas.style.height = cssH + "px";
  canvas.width  = Math.round(cssW * dpr);
  canvas.height = Math.round(cssH * dpr);

  scale = canvas.width / LOGICAL_W;
  viewH = canvas.height / scale;
}
window.addEventListener("resize", resize);
resize();

/* --------------------------------- Audio -------------------------------- */
/* Kleine Soundeffekte, komplett per WebAudio erzeugt (keine Audiodateien). */

const Sound = {
  ctx: null,
  muted: store.getItem("dj_muted") === "1",

  ensure() {                          // AudioContext darf erst nach einer Nutzergeste starten
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) this.ctx = new AC();
    }
    if (this.ctx && this.ctx.state === "suspended") this.ctx.resume();
  },

  toggleMute() {
    this.muted = !this.muted;
    store.setItem("dj_muted", this.muted ? "1" : "0");
  },

  blip(f0, f1, dur, type = "square", vol = 0.12) {
    if (this.muted || !this.ctx) return;
    const t = this.ctx.currentTime;
    const osc  = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(f0, t);
    osc.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(this.ctx.destination);
    osc.start(t);
    osc.stop(t + dur);
  },

  jump()    { this.blip(300, 550, 0.12, "square");   },
  spring()  { this.blip(400, 1200, 0.25, "square");  },
  jetpack() { this.blip(150, 900, 0.6, "sawtooth", 0.08); },
  breakP()  { this.blip(220, 80, 0.18, "triangle");  },
  stomp()   { this.blip(500, 200, 0.15, "square");   },
  click()   { this.blip(600, 400, 0.06, "square", 0.08); },
  gameOver(){ this.blip(500, 60, 0.7, "sawtooth", 0.15); },
};

/* --------------------------------- Input -------------------------------- */
/* Kippsteuerung ist die Hauptsteuerung auf dem Handy. Die Neigung wird
 * analog übernommen: leicht kippen = langsam, stark kippen = schnell.
 * Tastatur (Pfeile/A/D) für den Rechner; Touch nur als Ersatz, wenn kein
 * Neigungssensor liefert. */

const Input = {
  left: false,
  right: false,
  tilt: 0,               // -1..1 aus der Geräteneigung
  tiltAvailable: false,  // wird true, sobald echte Sensordaten ankommen
  pointerActive: false,
  pointerX: 0,

  /* Analoge Steuerachse -1..1 */
  axis(playerX) {
    if (this.left && !this.right)  return -1;
    if (this.right && !this.left)  return 1;
    if (this.tiltAvailable) {
      const t = Math.abs(this.tilt) < 0.06 ? 0 : this.tilt;  // kleine Totzone
      return clamp(t * 1.35, -1, 1);
    }
    if (this.pointerActive && Math.abs(this.pointerX - playerX) > 14) {
      return this.pointerX < playerX ? -1 : 1;
    }
    return 0;
  },
};

window.addEventListener("keydown", (e) => {
  if (e.repeat) return;
  switch (e.code) {
    case "ArrowLeft": case "KeyA":  Input.left = true;  break;
    case "ArrowRight": case "KeyD": Input.right = true; break;
    case "KeyM":                    Sound.toggleMute(); break;
    case "KeyP":                    game.togglePause(); break;
    case "Escape":
      if (game.state === STATE.GAMEOVER) game.toMenu();
      else game.togglePause();
      break;
    case "Space": case "Enter":     game.confirm();     break;
    case "Digit1":                  if (game.state === STATE.START) game.start("classic"); break;
    case "Digit2": case "KeyW":     if (game.state === STATE.START) game.start("space");   break;
  }
});
window.addEventListener("keyup", (e) => {
  switch (e.code) {
    case "ArrowLeft": case "KeyA":  Input.left = false;  break;
    case "ArrowRight": case "KeyD": Input.right = false; break;
  }
});

// Zeigerposition in logische Koordinaten umrechnen
function pointerLogical(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (clientX - rect.left) / rect.width  * LOGICAL_W,
    y: (clientY - rect.top)  / rect.height * viewH,
  };
}

function onPointerDown(clientX, clientY) {
  Sound.ensure();
  requestTiltPermission();      // Nutzergeste: hier darf iOS um Erlaubnis gefragt werden
  const p = pointerLogical(clientX, clientY);
  game.tap(p.x, p.y);
}

canvas.addEventListener("mousedown",  (e) => onPointerDown(e.clientX, e.clientY));
window.addEventListener("mousemove",  (e) => { if (Input.pointerActive) Input.pointerX = pointerLogical(e.clientX, e.clientY).x; });
window.addEventListener("mouseup",    ()  => { Input.pointerActive = false; });

canvas.addEventListener("touchstart", (e) => {
  e.preventDefault();
  const t = e.changedTouches[0];
  onPointerDown(t.clientX, t.clientY);
}, { passive: false });
canvas.addEventListener("touchmove",  (e) => {
  e.preventDefault();
  if (Input.pointerActive) Input.pointerX = pointerLogical(e.changedTouches[0].clientX, 0).x;
}, { passive: false });
canvas.addEventListener("touchend",   (e) => { e.preventDefault(); Input.pointerActive = false; }, { passive: false });
canvas.addEventListener("touchcancel",()  => { Input.pointerActive = false; });

/* Neigungssensor aktivieren. Auf den meisten Geräten geht das sofort;
 * iOS 13+ verlangt eine ausdrückliche Erlaubnis, die nur aus einer
 * Nutzergeste heraus angefragt werden darf – das erledigt der erste Tipp. */
let tiltRequested = false;
const needsTiltPermission = window.DeviceOrientationEvent &&
  typeof window.DeviceOrientationEvent.requestPermission === "function";

if (window.DeviceOrientationEvent && !needsTiltPermission) {
  window.addEventListener("deviceorientation", onTilt);
}

function requestTiltPermission() {
  if (tiltRequested || !needsTiltPermission) return;
  tiltRequested = true;
  window.DeviceOrientationEvent.requestPermission().then((res) => {
    if (res === "granted") window.addEventListener("deviceorientation", onTilt);
  }).catch(() => {});
}

function onTilt(e) {
  if (e.gamma == null && e.beta == null) return;
  // Bildschirmdrehung berücksichtigen, damit "kippen" immer links/rechts bedeutet
  const angle = (screen.orientation && screen.orientation.angle != null)
    ? screen.orientation.angle
    : (window.orientation || 0);
  let t;
  switch (angle) {
    case 90:            t =  (e.beta  || 0); break;
    case -90: case 270: t = -(e.beta  || 0); break;
    case 180:           t = -(e.gamma || 0); break;
    default:            t =  (e.gamma || 0);
  }
  Input.tilt = clamp(t / 22, -1, 1);   // ~22° Neigung = volle Geschwindigkeit
  Input.tiltAvailable = true;
}

/* --------------------------- Zeichen-Hilfen ------------------------------ */

function roundRect(c, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

// Pillenform (voll gerundete Enden) – die Grundform aller Plattformen
function pill(c, x, y, w, h) { roundRect(c, x, y, w, h, h / 2); }

/* Kritzel-Textur wie im Original: helle Bögen links, Strich + Bögen rechts */
function platformTexture(c, w, light, dark) {
  c.lineCap = "round";
  c.lineWidth = 1.6;
  c.strokeStyle = light;
  c.beginPath();
  for (let i = 0; i < 3; i++) {
    const x = -w / 2 + 10 + i * 4.5;
    c.moveTo(x, -3.5);
    c.quadraticCurveTo(x - 3.5, 0, x, 3.5);
  }
  c.moveTo(-6, -2); c.lineTo(6, -2);
  c.stroke();
  c.strokeStyle = dark;
  c.beginPath();
  c.moveTo(-4, 1.5); c.lineTo(9, 1.5);
  for (let i = 0; i < 3; i++) {
    const x = w / 2 - 10 - i * 4.5;
    c.moveTo(x, -3.5);
    c.quadraticCurveTo(x + 3.5, 0, x, 3.5);
  }
  c.stroke();
}

/* ---------------------------- Plattform-Typen --------------------------- */

const P_NORMAL = 0;   // grün:  stabil
const P_MOVING = 1;   // blau:  pendelt horizontal
const P_BREAK  = 2;   // braun: zerbricht beim Landen, gibt keinen Sprung
const P_VANISH = 3;   // weiß:  gibt genau einen Sprung und löst sich dann auf

class Platform {
  constructor(x, y, type) {
    this.x = x;             // Mittelpunkt (Welt-Koordinaten)
    this.y = y;
    this.w = PLATFORM_W;
    this.h = PLATFORM_H;
    this.type = type;
    this.vx = type === P_MOVING ? (Math.random() < 0.5 ? -1 : 1) * rand(60, 120) : 0;
    this.broken = false;
    this.fallVy = 0;
    this.alpha = 1;         // für das Auflösen weißer Plattformen
    this.item = null;       // Trampolin oder Jetpack auf der Plattform
  }

  update(dt) {
    if (this.type === P_MOVING && !this.broken) {
      this.x += this.vx * dt;
      const half = this.w / 2;
      if (this.x < half)             { this.x = half;             this.vx =  Math.abs(this.vx); }
      if (this.x > LOGICAL_W - half) { this.x = LOGICAL_W - half; this.vx = -Math.abs(this.vx); }
    }
    if (this.broken) {
      this.fallVy += GRAVITY * 0.6 * dt;
      this.y += this.fallVy * dt;
    }
    if (this.type === P_VANISH && this.alpha < 1) {
      this.alpha = Math.max(0, this.alpha - 3 * dt);
    }
  }

  landable() {
    return !this.broken && !(this.type === P_VANISH && this.alpha < 1);
  }

  draw(c, camY) {
    const sy = this.y - camY;
    c.save();
    c.globalAlpha = this.alpha;
    c.translate(this.x, sy);
    if (this.type === P_BREAK) {
      this.drawBroken(c);
    } else if (game.themeName === "space") {
      this.drawSpace(c);
    } else {
      this.drawClassic(c);
    }
    c.restore();
    if (this.item) this.item.draw(c, camY);
  }

  /* Klassischer Look: satte Pillenform, fast schwarze Umrandung, Kritzel */
  drawClassic(c) {
    let fill, light, dark, outline = "#26261e";
    switch (this.type) {
      case P_MOVING: fill = "#63b8e8"; light = "#c2e6f8"; dark = "#2a7cad"; break;
      case P_VANISH: fill = "#f4f1e6"; light = "#ffffff"; dark = "#c9c4b0"; outline = "#8f8a76"; break;
      default:       fill = "#61c214"; light = "#b8ef7a"; dark = "#2f7a08"; break;
    }
    pill(c, -this.w / 2, -this.h / 2, this.w, this.h);
    c.fillStyle = fill;
    c.fill();
    c.lineWidth = 2.6;
    c.strokeStyle = outline;
    c.stroke();
    platformTexture(c, this.w, light, dark);
  }

  /* Weltraum-Look: leuchtende Energie-Balken bzw. Hologramme */
  drawSpace(c) {
    let fill, glow;
    switch (this.type) {
      case P_MOVING: fill = "#38ccff"; glow = "#38ccff"; break;
      case P_VANISH: fill = "rgba(205,232,255,0.35)"; glow = "#9fdcff"; break;
      default:       fill = "#2bff88"; glow = "#2bff88"; break;
    }
    c.shadowColor = glow;
    c.shadowBlur = 14;
    pill(c, -this.w / 2, -this.h / 2, this.w, this.h);
    c.fillStyle = fill;
    c.fill();
    c.shadowBlur = 0;
    if (this.type === P_VANISH) {
      c.setLineDash([6, 5]);
      c.strokeStyle = "#9fdcff";
      c.lineWidth = 1.6;
      c.stroke();
      c.setLineDash([]);
    } else {
      // heller Kern in der Mitte
      pill(c, -this.w / 2 + 7, -3, this.w - 14, 6);
      c.fillStyle = "rgba(255,255,255,0.55)";
      c.fill();
    }
  }

  /* Braune Plattform: besteht sichtbar aus zwei Hälften mit Riss –
   * beim Landen klappen die Hälften auseinander und fallen. */
  drawBroken(c) {
    const space = game.themeName === "space";
    const fill    = space ? "#7a7264" : "#a5692e";
    const light   = space ? "#a39a88" : "#d19a55";
    const dark    = space ? "#4a4438" : "#6b3d12";
    const outline = space ? "#2c2820" : "#26261e";
    const prog = this.broken ? clamp(this.fallVy / 500, 0, 1) : 0;
    const hw = this.w / 2 - 2.5;      // Breite einer Hälfte

    for (const s of [-1, 1]) {
      c.save();
      c.translate(s * (this.w / 4 + 1.5 + prog * 12), prog * 6);
      c.rotate(s * prog * 0.55);
      pill(c, -hw / 2, -this.h / 2, hw, this.h);
      c.fillStyle = fill;
      c.fill();
      c.lineWidth = 2.4;
      c.strokeStyle = outline;
      c.stroke();
      // gezackte Bruchkante innen
      c.lineWidth = 1.8;
      c.strokeStyle = dark;
      c.beginPath();
      const ex = -s * hw / 2 + s * 2;
      c.moveTo(ex, -this.h / 2 + 2);
      c.lineTo(ex + s * 3, -1);
      c.lineTo(ex, this.h / 2 - 2);
      c.stroke();
      // helle Kritzelstriche
      c.strokeStyle = light;
      c.beginPath();
      c.moveTo(-hw / 2 + 6, -2); c.lineTo(hw / 2 - 6, -2);
      c.stroke();
      c.restore();
    }
  }
}

/* --------------------------- Items & Gegner ----------------------------- */

/* Trampolin (classic) bzw. Booster-Feld (space): hoher Sprung */
class Spring {
  constructor(platform, offsetX) {
    this.platform = platform;
    this.offsetX = offsetX;
    this.w = 34; this.h = 14;
    this.pressed = 0;
  }
  get x() { return this.platform.x + this.offsetX; }
  get y() { return this.platform.y - this.platform.h / 2 - this.h / 2; }
  update(dt) { this.pressed = Math.max(0, this.pressed - dt * 4); }

  draw(c, camY) {
    const sx = this.x, sy = this.y - camY;
    const squash = 1 - this.pressed * 0.45;
    c.save();
    c.translate(sx, sy + this.h / 2);

    if (game.themeName === "space") {
      // leuchtendes Booster-Feld
      c.scale(1, squash);
      c.shadowColor = "#c46bff";
      c.shadowBlur = 14;
      c.beginPath();
      c.ellipse(0, -6, 16, 6, 0, 0, Math.PI * 2);
      c.fillStyle = "#c46bff";
      c.fill();
      c.shadowBlur = 0;
      c.beginPath();
      c.ellipse(0, -6, 9, 3, 0, 0, Math.PI * 2);
      c.fillStyle = "#f2dcff";
      c.fill();
      // Sockel
      c.fillStyle = "#3a3a55";
      c.fillRect(-11, -3, 22, 3);
    } else {
      // rotes Trampolin wie im Original: Ring mit gelber Sprungfläche + Beinchen
      c.strokeStyle = "#26261e";
      c.lineWidth = 2.2;
      c.beginPath();                       // Beinchen
      c.moveTo(-11, -5); c.lineTo(-13, 0);
      c.moveTo(11, -5);  c.lineTo(13, 0);
      c.stroke();
      c.scale(1, squash);
      c.beginPath();                       // gelbe Sprungfläche
      c.ellipse(0, -8, 12, 4.5, 0, 0, Math.PI * 2);
      c.fillStyle = "#f7d84b";
      c.fill();
      c.beginPath();                       // roter Ring
      c.ellipse(0, -8, 16, 6.5, 0, 0, Math.PI * 2);
      c.lineWidth = 5;
      c.strokeStyle = "#d93a2b";
      c.stroke();
      c.lineWidth = 1.8;                   // dünne dunkle Kontur
      c.strokeStyle = "#26261e";
      c.stroke();
      c.beginPath();
      c.ellipse(0, -8, 12, 4.5, 0, 0, Math.PI * 2);
      c.stroke();
    }
    c.restore();
  }
}

/* Jetpack (classic) bzw. Rakete (space): kurzer Senkrechtflug */
class Jetpack {
  constructor(platform, offsetX) {
    this.platform = platform;
    this.offsetX = offsetX;
    this.w = 22; this.h = 30;
    this.taken = false;
  }
  get x() { return this.platform.x + this.offsetX; }
  get y() { return this.platform.y - this.platform.h / 2 - this.h / 2; }
  update() {}

  draw(c, camY) {
    if (this.taken) return;
    const sx = this.x, sy = this.y - camY;
    c.save();
    c.translate(sx, sy);
    if (game.themeName === "space") {
      // kleine Rakete
      c.beginPath();                     // Spitze
      c.moveTo(0, -15); c.lineTo(7, -4); c.lineTo(-7, -4);
      c.closePath();
      c.fillStyle = "#ff5f4b";
      c.fill();
      roundRect(c, -7, -5, 14, 16, 4);   // Rumpf
      c.fillStyle = "#e8e8f2";
      c.fill();
      c.strokeStyle = "#8a8aa0";
      c.lineWidth = 1.6;
      c.stroke();
      c.beginPath();                     // Bullauge
      c.arc(0, 2, 3.2, 0, Math.PI * 2);
      c.fillStyle = "#38ccff";
      c.fill();
      c.beginPath();                     // Finnen
      c.moveTo(-7, 6); c.lineTo(-11, 13); c.lineTo(-7, 11);
      c.moveTo(7, 6);  c.lineTo(11, 13);  c.lineTo(7, 11);
      c.fillStyle = "#ff5f4b";
      c.fill();
    } else {
      // silbernes Jetpack mit Gurt, Düse und rundem Tank-Deckel
      roundRect(c, -8, -13, 16, 24, 7);
      const grad = c.createLinearGradient(-8, 0, 8, 0);
      grad.addColorStop(0, "#b9b9bd");
      grad.addColorStop(0.45, "#e9e9ee");
      grad.addColorStop(1, "#9a9aa0");
      c.fillStyle = grad;
      c.fill();
      c.lineWidth = 2.2;
      c.strokeStyle = "#3c3c40";
      c.stroke();
      c.beginPath();                     // Deckel oben
      c.ellipse(0, -13, 6.5, 3, 0, 0, Math.PI * 2);
      c.fillStyle = "#8f8f96";
      c.fill();
      c.stroke();
      c.beginPath();                     // Düse unten
      c.moveTo(-5, 11); c.lineTo(5, 11); c.lineTo(7, 16); c.lineTo(-7, 16);
      c.closePath();
      c.fillStyle = "#55555c";
      c.fill();
      c.strokeStyle = "#26261e";
      c.lineWidth = 1.6;
      c.stroke();
      c.beginPath();                     // Gurtband
      c.moveTo(-8, -3); c.quadraticCurveTo(0, 1, 8, -3);
      c.strokeStyle = "#7a5a2a";
      c.lineWidth = 2.4;
      c.stroke();
      c.beginPath();                     // roter Knopf
      c.arc(3.5, -7, 2, 0, Math.PI * 2);
      c.fillStyle = "#d93a2b";
      c.fill();
    }
    c.restore();
  }
}

/* Monster (classic: Kritzel-Monster, space: UFO) */
class Monster {
  constructor(x, y) {
    this.x = x; this.y = y;
    this.w = 46; this.h = 36;
    this.baseX = x;
    this.t = rand(0, Math.PI * 2);
    this.dead = false;
    this.fallVy = 0;
  }
  update(dt) {
    if (this.dead) {
      this.fallVy += GRAVITY * dt;
      this.y += this.fallVy * dt;
      return;
    }
    this.t += dt * 1.6;
    this.x = this.baseX + Math.sin(this.t) * 46;
    this.x = clamp(this.x, this.w / 2, LOGICAL_W - this.w / 2);
  }

  draw(c, camY) {
    const sy = this.y - camY;
    const bob = this.dead ? 0 : Math.sin(this.t * 2.4) * 2.5;
    c.save();
    c.translate(this.x, sy + bob);
    if (this.dead) c.scale(1, -1);

    if (game.themeName === "space") {
      // UFO: Untertasse mit Kuppel und Positionslichtern
      c.shadowColor = "#38ccff";
      c.shadowBlur = 10;
      c.beginPath();
      c.ellipse(0, 4, 22, 9, 0, 0, Math.PI * 2);
      c.fillStyle = "#8a8aa8";
      c.fill();
      c.shadowBlur = 0;
      c.beginPath();
      c.ellipse(0, 4, 22, 9, 0, 0, Math.PI * 2);
      c.strokeStyle = "#4a4a68";
      c.lineWidth = 2;
      c.stroke();
      c.beginPath();                     // Glaskuppel
      c.arc(0, -2, 11, Math.PI, 0);
      c.closePath();
      c.fillStyle = "rgba(160,220,255,0.55)";
      c.fill();
      c.stroke();
      c.beginPath();                     // Alien-Kopf in der Kuppel
      c.arc(0, -5, 5, 0, Math.PI * 2);
      c.fillStyle = "#6fdc6f";
      c.fill();
      for (const ex of [-2, 2]) {
        c.beginPath(); c.arc(ex, -6, 1.2, 0, Math.PI * 2);
        c.fillStyle = "#123312"; c.fill();
      }
      // blinkende Lichter
      for (let i = -1; i <= 1; i++) {
        const on = Math.sin(nowSec * 6 + i * 2.1) > 0;
        c.beginPath();
        c.arc(i * 12, 6, 2.4, 0, Math.PI * 2);
        c.fillStyle = on ? "#ffe066" : "#5a5a78";
        c.fill();
      }
    } else {
      // blaues Kritzel-Monster mit Zacken-Rücken und großen Augen
      c.beginPath();
      c.moveTo(-22, 12);
      c.quadraticCurveTo(-27, -8, -14, -12);
      c.lineTo(-9, -18); c.lineTo(-5, -12);   // Zacken
      c.lineTo(0, -19);  c.lineTo(5, -12);
      c.lineTo(9, -18);  c.lineTo(14, -12);
      c.quadraticCurveTo(27, -8, 22, 12);
      c.quadraticCurveTo(0, 19, -22, 12);
      c.closePath();
      c.fillStyle = "#79c7ec";
      c.fill();
      c.strokeStyle = "#26404e";
      c.lineWidth = 2.6;
      c.stroke();
      for (const ex of [-8, 8]) {              // Augen
        c.beginPath(); c.arc(ex, -3, 6, 0, Math.PI * 2);
        c.fillStyle = "#fff"; c.fill();
        c.strokeStyle = "#26404e"; c.lineWidth = 1.6; c.stroke();
        c.beginPath(); c.arc(ex + 1, -2, 2.6, 0, Math.PI * 2);
        c.fillStyle = "#1b1b1b"; c.fill();
      }
      c.beginPath();                           // Mund
      c.arc(0, 8, 5.5, 0.15 * Math.PI, 0.85 * Math.PI);
      c.strokeStyle = "#26404e";
      c.lineWidth = 2;
      c.stroke();
    }
    c.restore();
  }
}

/* Kleine Partikel für Jetpack-Flamme und zerplatzende Plattformen */
class Particle {
  constructor(x, y, vx, vy, life, color, size) {
    this.x = x; this.y = y; this.vx = vx; this.vy = vy;
    this.life = life; this.maxLife = life;
    this.color = color; this.size = size;
  }
  update(dt) {
    this.life -= dt;
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    this.vy += 500 * dt;
  }
  draw(c, camY) {
    c.globalAlpha = clamp(this.life / this.maxLife, 0, 1);
    c.fillStyle = this.color;
    const s = this.size * (0.5 + 0.5 * this.life / this.maxLife);
    c.fillRect(this.x - s / 2, this.y - camY - s / 2, s, s);
    c.globalAlpha = 1;
  }
}

/* -------------------------------- Spieler ------------------------------- */

class Player {
  constructor() {
    this.w = 40;
    this.h = 46;
    this.reset();
  }
  reset() {
    this.x = LOGICAL_W / 2;
    this.y = 0;
    this.vx = 0;
    this.vy = JUMP_VY;
    this.facing = 1;
    this.jetpackT = 0;
  }
  get bottom() { return this.y + this.h / 2; }

  update(dt) {
    // analoge Steuerung: vx nähert sich der gewünschten Geschwindigkeit
    const a = Input.axis(this.x);
    if (a !== 0) {
      const target = a * MOVE_MAX;
      this.vx += (target - this.vx) * Math.min(1, MOVE_EASE * dt);
      this.facing = a < 0 ? -1 : 1;
    } else {
      this.vx -= this.vx * Math.min(1, FRICTION * dt);
    }
    this.x += this.vx * dt;

    // horizontales Wrapping an den Bildschirmrändern
    if (this.x < -this.w / 2)            this.x = LOGICAL_W + this.w / 2;
    if (this.x > LOGICAL_W + this.w / 2) this.x = -this.w / 2;

    // Vertikal: Jetpack überschreibt die normale Physik
    if (this.jetpackT > 0) {
      this.jetpackT -= dt;
      this.vy = JETPACK_VY;
    } else {
      this.vy += GRAVITY * dt;
    }
    this.y += this.vy * dt;
  }

  draw(c, camY) {
    c.save();
    c.translate(this.x, this.y - camY);
    c.rotate(clamp(this.vx / MOVE_MAX, -1, 1) * 0.1);
    c.scale(this.facing, 1);
    const squash = this.vy < -300 ? 1.05 : (this.vy > 500 ? 0.96 : 1);
    c.scale(1 / squash, squash);

    if (game.themeName === "space") this.drawSpace(c);
    else this.drawClassic(c);
    c.restore();
  }

  /* Der klassische Doodler: gelbgrüner Rüssel-Blob mit Streifenbauch,
   * vier Beinchen und Trompeten-Nase – so nah am Original wie möglich. */
  drawClassic(c) {
    const OUT = "#3a3a20";        // dunkle Skizzen-Kontur
    // Jetpack auf dem Rücken zuerst (liegt hinter dem Körper)
    if (this.jetpackT > 0) {
      roundRect(c, -28, -10, 13, 24, 5);
      c.fillStyle = "#c9c9ce";
      c.fill();
      c.strokeStyle = "#3c3c40";
      c.lineWidth = 2;
      c.stroke();
    }

    // vier Beinchen
    c.strokeStyle = OUT;
    c.lineWidth = 3;
    c.lineCap = "round";
    const legLift = this.vy < 0 ? 2.5 : 0;
    c.beginPath();
    for (const lx of [-12, -5, 3, 10]) {
      c.moveTo(lx, 18);
      c.lineTo(lx + 1, 26 - legLift);
    }
    c.stroke();

    // Körper: glockige Form – oben gerundet, unten leicht ausgestellt
    c.beginPath();
    c.moveTo(-16, 20);
    c.bezierCurveTo(-21, 8, -20, -14, -10, -19);
    c.bezierCurveTo(-4, -22.5, 6, -22.5, 11, -18);
    c.bezierCurveTo(19, -12, 20, 8, 16, 20);
    c.quadraticCurveTo(0, 23, -16, 20);
    c.closePath();
    c.fillStyle = "#c6d64a";
    c.fill();
    c.lineWidth = 3;
    c.strokeStyle = OUT;
    c.stroke();

    // dunkelgrüne Bauchstreifen (innerhalb des Körpers)
    c.save();
    c.clip();
    c.fillStyle = "#6e8a24";
    c.fillRect(-22, 8.5, 44, 3);
    c.fillRect(-22, 14, 44, 3);
    c.fillRect(-22, 19.5, 44, 3);
    c.restore();

    // Trompeten-Nase in Blickrichtung
    c.beginPath();
    c.moveTo(13, -8);
    c.lineTo(27, -10.5);
    c.moveTo(13, 0);
    c.lineTo(27, -1);
    c.lineWidth = 2.6;
    c.strokeStyle = OUT;
    c.stroke();
    c.beginPath();                    // offener Trichter
    c.ellipse(27.5, -5.8, 2.8, 5.4, -0.08, 0, Math.PI * 2);
    c.fillStyle = "#c6d64a";
    c.fill();
    c.stroke();
    c.beginPath();                    // dunkle Öffnung
    c.ellipse(27.5, -5.8, 1.2, 3.4, -0.08, 0, Math.PI * 2);
    c.fillStyle = "#3a3a20";
    c.fill();

    // kleine schwarze Augen dicht beieinander
    c.beginPath(); c.arc(0, -12, 2.1, 0, Math.PI * 2);
    c.fillStyle = "#1e1e14"; c.fill();
    c.beginPath(); c.arc(8, -12, 2.1, 0, Math.PI * 2);
    c.fill();
  }

  /* Weltraum-Variante: kleines grünes Alien im Raumanzug mit Glaskuppel */
  drawSpace(c) {
    // Raketen-Rucksack zuerst
    if (this.jetpackT > 0) {
      roundRect(c, -26, -8, 12, 22, 5);
      c.fillStyle = "#e8e8f2";
      c.fill();
      c.strokeStyle = "#8a8aa0";
      c.lineWidth = 2;
      c.stroke();
    }

    // Stiefel
    c.strokeStyle = "#cfd4ea";
    c.lineWidth = 5;
    c.lineCap = "round";
    c.beginPath();
    c.moveTo(-7, 18); c.lineTo(-8, 24);
    c.moveTo(7, 18);  c.lineTo(8, 24);
    c.stroke();

    // Anzug-Körper
    roundRect(c, -13, 0, 26, 20, 9);
    c.fillStyle = "#f0f2fa";
    c.fill();
    c.strokeStyle = "#8a8aa0";
    c.lineWidth = 2.4;
    c.stroke();
    roundRect(c, -6, 5, 12, 9, 3);     // Brustpanel
    c.fillStyle = "#3a3a55";
    c.fill();
    for (let i = 0; i < 3; i++) {      // Kontrolllampen
      c.beginPath();
      c.arc(-3 + i * 3, 9.5, 1.1, 0, Math.PI * 2);
      c.fillStyle = ["#ff5f4b", "#ffe066", "#2bff88"][i];
      c.fill();
    }

    // Antenne
    c.strokeStyle = "#8a8aa0";
    c.lineWidth = 1.8;
    c.beginPath();
    c.moveTo(0, -24); c.lineTo(0, -30);
    c.stroke();
    c.beginPath();
    c.arc(0, -32, 2.2, 0, Math.PI * 2);
    c.fillStyle = "#ffe066";
    c.shadowColor = "#ffe066";
    c.shadowBlur = 8;
    c.fill();
    c.shadowBlur = 0;

    // grüner Alien-Kopf
    c.beginPath();
    c.arc(0, -10, 10, 0, Math.PI * 2);
    c.fillStyle = "#6fdc6f";
    c.fill();
    c.strokeStyle = "#2e7a2e";
    c.lineWidth = 2;
    c.stroke();
    for (const s of [-1, 1]) {         // große mandelförmige Augen
      c.beginPath();
      c.ellipse(s * 4, -11, 2.6, 4, s * 0.35, 0, Math.PI * 2);
      c.fillStyle = "#12240f";
      c.fill();
    }

    // Glaskuppel über dem Kopf
    c.beginPath();
    c.arc(0, -10, 14.5, 0, Math.PI * 2);
    c.fillStyle = "rgba(170,215,255,0.22)";
    c.fill();
    c.strokeStyle = "rgba(200,230,255,0.85)";
    c.lineWidth = 2;
    c.stroke();
    c.beginPath();                     // Lichtreflex
    c.arc(-5, -16, 6, Math.PI * 0.9, Math.PI * 1.5);
    c.strokeStyle = "rgba(255,255,255,0.8)";
    c.lineWidth = 1.6;
    c.stroke();
  }
}

/* ------------------------- Hintergrund-Dekor ---------------------------- */

/* Sternenfeld für das Weltraum-Design (mit Parallaxe und Funkeln) */
const stars = [];
for (let i = 0; i < 90; i++) {
  stars.push({
    x: hash(i * 3.1) * LOGICAL_W,
    y: hash(i * 7.7) * 1200,
    r: 0.6 + hash(i * 13.3) * 1.4,
    tw: hash(i * 29.7) * Math.PI * 2,
    p: i % 3 === 0 ? 0.5 : 0.25,     // Parallaxe-Faktor
  });
}

/* Kleiner Kritzel-Käfer für den Startbildschirm */
function drawBug(c, x, y, color, rot) {
  c.save();
  c.translate(x, y);
  c.rotate(rot);
  c.strokeStyle = "#26261e";
  c.lineWidth = 1.6;
  c.beginPath();
  for (const s of [-1, 1]) {
    for (let i = -1; i <= 1; i++) {
      c.moveTo(s * 6, i * 3);
      c.lineTo(s * 11, i * 4 - 2);
    }
  }
  c.stroke();
  c.beginPath();
  c.ellipse(0, 0, 8, 5.5, 0, 0, Math.PI * 2);
  c.fillStyle = color;
  c.fill();
  c.stroke();
  c.beginPath(); c.arc(-3, -1, 1, 0, Math.PI * 2); c.fillStyle = "#1b1b1b"; c.fill();
  c.beginPath(); c.arc(3, -1, 1, 0, Math.PI * 2);  c.fill();
  c.restore();
}

/* UFO mit Lichtkegel für den Startbildschirm (wie im Original oben rechts) */
function drawMenuUFO(c, x, y) {
  c.save();
  c.translate(x, y);
  c.beginPath();                       // Lichtkegel
  c.moveTo(-12, 8);
  c.lineTo(12, 8);
  c.lineTo(34, 120);
  c.lineTo(-34, 120);
  c.closePath();
  c.fillStyle = "rgba(190,170,120,0.28)";
  c.fill();
  c.beginPath();                       // Untertasse
  c.ellipse(0, 4, 30, 10, -0.06, 0, Math.PI * 2);
  c.fillStyle = "#8fa653";
  c.fill();
  c.strokeStyle = "#26261e";
  c.lineWidth = 2.4;
  c.stroke();
  c.beginPath();                       // Kuppel
  c.ellipse(0, -5, 15, 10, 0, Math.PI, 0);
  c.fillStyle = "#a8bf68";
  c.fill();
  c.stroke();
  c.restore();
}

/* ------------------------------- UI-Knöpfe ------------------------------ */

/* Handgezeichneter ovaler Knopf; gibt sein Trefferrechteck zurück */
function drawOvalButton(c, btn) {
  c.save();
  c.translate(btn.x, btn.y);
  c.rotate(btn.rot || 0);
  const space = btn.space === true;

  c.beginPath();
  c.ellipse(0, 0, btn.w / 2, btn.h / 2, 0, 0, Math.PI * 2);
  if (space) {
    c.fillStyle = "#141433";
    c.fill();
    c.strokeStyle = "#26261e";
    c.lineWidth = 3;
    c.stroke();
    // winzige Sterne im Knopf
    for (let i = 0; i < 7; i++) {
      c.beginPath();
      c.arc((hash(i * 5.3) - 0.5) * btn.w * 0.8, (hash(i * 9.1) - 0.5) * btn.h * 0.7, 1.1, 0, Math.PI * 2);
      c.fillStyle = "rgba(255,255,255,0.85)";
      c.fill();
    }
  } else {
    c.fillStyle = "#f4e7c3";
    c.fill();
    c.strokeStyle = "#26261e";
    c.lineWidth = 3;
    c.stroke();
    // zweite, leicht versetzte Linie für den Skizzen-Look
    c.beginPath();
    c.ellipse(1, 1.5, btn.w / 2 - 3, btn.h / 2 - 3, 0.02, 0, Math.PI * 2);
    c.strokeStyle = "#b98f3e";
    c.lineWidth = 1.4;
    c.stroke();
  }

  c.font = "bold 27px " + HAND;
  c.textAlign = "center";
  c.textBaseline = "middle";
  c.fillStyle = space ? "#cfe8ff" : "#2e2a1e";
  c.fillText(btn.label, 0, 2);
  c.restore();
}

function hitButton(buttons, lx, ly) {
  for (const b of buttons) {
    if (Math.abs(lx - b.x) < b.w / 2 && Math.abs(ly - b.y) < b.h / 2) return b.id;
  }
  return null;
}

/* --------------------------------- Spiel -------------------------------- */

const game = {
  state: STATE.START,
  themeName: "classic",
  player: new Player(),
  platforms: [],
  monsters: [],
  particles: [],
  camY: 0,
  nextGenY: 0,
  score: 0,
  best: parseInt(store.getItem("dj_highscore") || "0", 10),
  startY: 0,
  shake: 0,
  uiButtons: [],          // aktuell sichtbare Knöpfe (für Treffertest)

  difficulty() { return clamp(this.score / 2500, 0, 1); },

  reset() {
    this.player.reset();
    this.platforms = [];
    this.monsters = [];
    this.particles = [];
    this.score = 0;
    this.shake = 0;
    this.camY = this.player.y - viewH * 0.65;
    this.startY = this.player.y;

    const first = new Platform(this.player.x, this.player.y + 40, P_NORMAL);
    this.platforms.push(first);

    let y = first.y - 70;
    while (y > this.camY - 100) {
      this.platforms.push(new Platform(rand(PLATFORM_W / 2, LOGICAL_W - PLATFORM_W / 2), y, P_NORMAL));
      y -= rand(55, 80);
    }
    this.nextGenY = y;
  },

  /* Erzeugt Plattformen (und gelegentlich Items/Monster) oberhalb des Bildes.
   * Pro "Etage" gibt es immer eine landbare Plattform, damit das Spiel
   * nie unschaffbar wird; braune Plattformen kommen nur zusätzlich dazu. */
  generate() {
    const d = this.difficulty();
    while (this.nextGenY > this.camY - viewH) {
      const y = this.nextGenY;
      const x = rand(PLATFORM_W / 2, LOGICAL_W - PLATFORM_W / 2);

      let type = P_NORMAL;
      const r = Math.random();
      if      (r < lerp(0.06, 0.30, d)) type = P_MOVING;
      else if (r < lerp(0.08, 0.44, d)) type = P_VANISH;

      const p = new Platform(x, y, type);
      this.platforms.push(p);

      if (type === P_NORMAL) {
        const ir = Math.random();
        if (ir < 0.045)      p.item = new Jetpack(p, rand(-14, 14));
        else if (ir < 0.16)  p.item = new Spring(p, rand(-14, 14));
      }

      if (Math.random() < lerp(0.10, 0.32, d)) {
        let bx = rand(PLATFORM_W / 2, LOGICAL_W - PLATFORM_W / 2);
        if (Math.abs(bx - x) < PLATFORM_W * 1.2) bx = (x + LOGICAL_W / 2) % LOGICAL_W;
        this.platforms.push(new Platform(clamp(bx, PLATFORM_W / 2, LOGICAL_W - PLATFORM_W / 2), y + rand(-24, 24), P_BREAK));
      }

      if (this.score > 300 && Math.random() < lerp(0.015, 0.06, d)) {
        this.monsters.push(new Monster(rand(60, LOGICAL_W - 60), y - rand(90, 140)));
      }

      this.nextGenY = y - rand(lerp(52, 85, d), lerp(85, 128, d));
    }
  },

  start(themeName) {
    Sound.ensure();
    Sound.click();
    this.themeName = themeName;
    this.reset();
    this.state = STATE.PLAYING;
  },

  toMenu() {
    this.state = STATE.START;
    this.themeName = "classic";   // das Menü ist immer im Papier-Look
    this.reset();
  },

  confirm() {
    Sound.ensure();
    if (this.state === STATE.START)         this.start("classic");
    else if (this.state === STATE.GAMEOVER) this.start(this.themeName);
    else if (this.state === STATE.PAUSED)   this.state = STATE.PLAYING;
  },

  togglePause() {
    if (this.state === STATE.PLAYING)      this.state = STATE.PAUSED;
    else if (this.state === STATE.PAUSED)  this.state = STATE.PLAYING;
  },

  /* Zentrale Klick-/Tipp-Behandlung (logische Koordinaten) */
  tap(lx, ly) {
    if (this.state === STATE.START) {
      // Lautsprecher unten links
      if (lx < 54 && ly > viewH - 54) { Sound.toggleMute(); return; }
      const id = hitButton(this.uiButtons, lx, ly);
      if (id === "classic" || id === "space") this.start(id);
      return;
    }
    if (this.state === STATE.GAMEOVER) {
      const id = hitButton(this.uiButtons, lx, ly);
      if (id === "again") this.start(this.themeName);
      else if (id === "menu") this.toMenu();
      return;
    }
    if (this.state === STATE.PAUSED) { this.state = STATE.PLAYING; return; }

    // im Spiel: Pause-Knopf oben rechts
    if (lx > LOGICAL_W - 56 && ly < HUD_H) { this.togglePause(); return; }
    // Touch-Ersatzsteuerung nur, wenn kein Neigungssensor liefert
    if (!Input.tiltAvailable) {
      Input.pointerActive = true;
      Input.pointerX = lx;
    }
  },

  die() {
    if (this.state !== STATE.PLAYING) return;
    this.state = STATE.GAMEOVER;
    Sound.gameOver();
    if (this.score > this.best) {
      this.best = this.score;
      store.setItem("dj_highscore", String(this.best));
    }
  },

  update(dt) {
    const pl = this.player;
    const prevBottom = pl.bottom;
    pl.update(dt);

    // Kamera folgt nur nach oben
    const target = pl.y - viewH * 0.45;
    if (target < this.camY) this.camY = target;

    this.score = Math.max(this.score, Math.floor((this.startY - pl.y) / 10));

    // Plattform-Kollisionen: nur beim Fallen, Füße kreuzen die Oberkante
    if (pl.vy > 0 && pl.jetpackT <= 0) {
      for (const p of this.platforms) {
        if (p.broken) continue;
        if (!p.landable() && p.type !== P_BREAK) continue;
        const top = p.y - p.h / 2;
        if (prevBottom <= top + 4 && pl.bottom >= top &&
            Math.abs(pl.x - p.x) < (pl.w * 0.38 + p.w / 2)) {

          if (p.type === P_BREAK) {
            p.broken = true;
            p.fallVy = 80;
            Sound.breakP();
            const col = this.themeName === "space" ? "#6b6355" : "#8a5a2b";
            for (let i = 0; i < 6; i++) {
              this.particles.push(new Particle(p.x + rand(-20, 20), p.y,
                rand(-60, 60), rand(-40, 10), 0.5, col, 5));
            }
            continue;
          }

          pl.y = top - pl.h / 2;

          let boosted = false;
          if (p.item instanceof Spring && Math.abs(pl.x - p.item.x) < 24) {
            pl.vy = SPRING_VY;
            p.item.pressed = 1;
            Sound.spring();
            boosted = true;
          }
          if (!boosted) {
            pl.vy = JUMP_VY;
            Sound.jump();
          }
          if (p.type === P_VANISH) p.alpha = 0.99;
          break;
        }
      }
    }

    // Jetpack einsammeln
    for (const p of this.platforms) {
      if (p.item instanceof Jetpack && !p.item.taken) {
        if (Math.abs(pl.x - p.item.x) < 30 && Math.abs(pl.y - p.item.y) < 40) {
          p.item.taken = true;
          pl.jetpackT = JETPACK_TIME;
          Sound.jetpack();
        }
      }
    }

    // Monster-Kollisionen
    for (const m of this.monsters) {
      if (m.dead) continue;
      const dx = Math.abs(pl.x - m.x);
      const dy = pl.y - m.y;
      if (dx < (pl.w + m.w) * 0.36 && Math.abs(dy) < (pl.h + m.h) * 0.36) {
        if (pl.jetpackT > 0 || (pl.vy > 0 && dy < -6)) {
          m.dead = true;
          if (pl.jetpackT <= 0) pl.vy = MONSTER_VY;
          this.shake = 0.25;
          Sound.stomp();
        } else {
          this.die();
          return;
        }
      }
    }

    for (const p of this.platforms) { p.update(dt); if (p.item) p.item.update(dt); }
    for (const m of this.monsters)   m.update(dt);
    for (const pa of this.particles) pa.update(dt);

    // Jetpack-Flamme
    if (pl.jetpackT > 0) {
      this.particles.push(new Particle(
        pl.x - pl.facing * 22, pl.y + 12,
        rand(-30, 30), rand(120, 220), 0.35,
        Math.random() < 0.5 ? "#f59f2d" : "#e2574c", 6));
    }

    // Aufräumen: alles unterhalb des Bildes entfernen (kein Speicherleck)
    const cutoff = this.camY + viewH + 60;
    this.platforms = this.platforms.filter((p) => p.y < cutoff);
    this.monsters  = this.monsters.filter((m) => m.y < cutoff);
    this.particles = this.particles.filter((pa) => pa.life > 0);

    this.generate();
    this.shake = Math.max(0, this.shake - dt);

    if (pl.y - this.camY > viewH + pl.h) this.die();
  },

  /* ------------------------------ Zeichnen ------------------------------ */

  drawBackground() {
    if (this.themeName === "space" && this.state !== STATE.START) {
      // Weltraum: dunkler Verlauf, ferne Nebel, funkelnde Sterne mit Parallaxe
      const g = ctx.createLinearGradient(0, 0, 0, viewH);
      g.addColorStop(0, "#05051a");
      g.addColorStop(1, "#12123a");
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, LOGICAL_W, viewH);

      const nebY = ((-this.camY * 0.1) % (viewH * 1.6) + viewH * 1.6) % (viewH * 1.6) - viewH * 0.3;
      const neb = ctx.createRadialGradient(300, nebY, 10, 300, nebY, 190);
      neb.addColorStop(0, "rgba(120,60,200,0.16)");
      neb.addColorStop(1, "rgba(120,60,200,0)");
      ctx.fillStyle = neb;
      ctx.fillRect(0, 0, LOGICAL_W, viewH);

      for (const s of stars) {
        const sy = ((s.y - this.camY * s.p) % viewH + viewH) % viewH;
        const a = 0.45 + 0.55 * Math.abs(Math.sin(nowSec * 1.5 + s.tw));
        ctx.globalAlpha = a;
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(s.x, sy, s.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    } else {
      // Karopapier wie im Original: cremefarben mit feinem, warmem Raster
      ctx.fillStyle = "#f8f3e4";
      ctx.fillRect(0, 0, LOGICAL_W, viewH);

      ctx.strokeStyle = "rgba(215,170,110,0.4)";
      ctx.lineWidth = 1;
      const grid = 20;
      const offY = -(this.camY % grid);
      ctx.beginPath();
      for (let x = 0.5; x <= LOGICAL_W; x += grid) {
        ctx.moveTo(x, 0); ctx.lineTo(x, viewH);
      }
      for (let y = offY - grid + 0.5; y <= viewH; y += grid) {
        ctx.moveTo(0, y); ctx.lineTo(LOGICAL_W, y);
      }
      ctx.stroke();
    }
  },

  /* HUD: Papierstreifen mit Abrisskante, Punktzahl links, Pause rechts */
  drawHUD() {
    const space = this.themeName === "space";
    ctx.fillStyle = space ? "rgba(8,8,30,0.72)" : "rgba(150,172,200,0.5)";
    ctx.fillRect(0, 0, LOGICAL_W, HUD_H);

    // unregelmäßige Abrisskante
    ctx.beginPath();
    ctx.moveTo(0, HUD_H);
    for (let x = 0; x <= LOGICAL_W; x += 13) {
      ctx.lineTo(x, HUD_H + hash(x) * 3.4);
    }
    ctx.strokeStyle = space ? "#4a4a78" : "#2a2a26";
    ctx.lineWidth = 2.6;
    ctx.stroke();

    ctx.fillStyle = space ? "#cfe8ff" : "#2e2a20";
    ctx.font = "bold 30px " + HAND;
    ctx.textAlign = "left";
    ctx.textBaseline = "middle";
    ctx.fillText(String(this.score), 14, HUD_H / 2 + 1);

    // Pause-Symbol (zwei Balken), klickbar
    ctx.fillStyle = space ? "#cfe8ff" : "#4a4a42";
    roundRect(ctx, LOGICAL_W - 40, 12, 7, 22, 3);
    ctx.fill();
    roundRect(ctx, LOGICAL_W - 28, 12, 7, 22, 3);
    ctx.fill();
  },

  /* Startbildschirm im Stil des Originals */
  drawMenu() {
    this.drawBackground();   // immer Papier-Look im Menü

    // Titel: rot, handschriftlich, leicht gedreht
    ctx.save();
    ctx.translate(LOGICAL_W / 2, viewH * 0.14);
    ctx.rotate(-0.055);
    ctx.font = "bold 52px " + HAND;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillStyle = "#a8271b";
    ctx.fillText("doodle jump", 0, 0);
    ctx.restore();

    drawMenuUFO(ctx, LOGICAL_W - 70, viewH * 0.06);
    drawBug(ctx, 50, viewH * 0.09, "#9ecb56", 0.4);
    drawBug(ctx, LOGICAL_W - 90, viewH * 0.4, "#e8c07a", -0.3);
    drawBug(ctx, 70, viewH * 0.52, "#8fc5e8", 0.15);

    // Knöpfe: klassisch & Weltraum
    this.uiButtons = [
      { id: "classic", label: "spielen",  x: LOGICAL_W / 2 - 30, y: viewH * 0.34, w: 230, h: 66, rot: -0.04 },
      { id: "space",   label: "weltraum", x: LOGICAL_W / 2 + 25, y: viewH * 0.48, w: 240, h: 66, rot: 0.03, space: true },
    ];
    for (const b of this.uiButtons) drawOvalButton(ctx, b);

    // Doodler hüpft links auf einer Plattform
    const px = 85;
    const py = viewH * 0.72;
    const bounce = Math.abs(Math.sin(nowSec * 3.4)) * 26;
    ctx.save();
    ctx.translate(px, py + 30);
    new Platform(0, 0, P_NORMAL).drawClassic(ctx);
    ctx.restore();
    this.player.x = px;
    this.player.y = py - bounce;
    this.player.vy = bounce > 13 ? -200 : 200;   // für die Squash-Animation
    this.player.facing = 1;
    this.player.draw(ctx, 0);

    // Hinweise & Rekord
    ctx.font = "16px " + HAND;
    ctx.textAlign = "center";
    ctx.fillStyle = "#6b6353";
    ctx.fillText("Handy kippen oder Pfeiltasten zum Steuern", LOGICAL_W / 2, viewH * 0.86);
    ctx.fillText("Rekord: " + this.best, LOGICAL_W / 2, viewH * 0.86 + 24);

    // Lautsprecher unten links
    this.drawSpeaker(12, viewH - 40, "#4a4a42");
  },

  drawSpeaker(x, y, color) {
    ctx.save();
    ctx.translate(x + 14, y + 14);
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-9, -4); ctx.lineTo(-4, -4); ctx.lineTo(2, -9);
    ctx.lineTo(2, 9); ctx.lineTo(-4, 4); ctx.lineTo(-9, 4);
    ctx.closePath();
    ctx.fill();
    if (Sound.muted) {
      ctx.beginPath();
      ctx.moveTo(6, -6); ctx.lineTo(14, 6);
      ctx.moveTo(14, -6); ctx.lineTo(6, 6);
      ctx.stroke();
    } else {
      ctx.beginPath();
      ctx.arc(4, 0, 7, -0.6, 0.6);
      ctx.stroke();
    }
    ctx.restore();
  },

  /* Überlagerung für Pause / Game Over */
  drawOverlay(title, titleColor, lines, buttons) {
    const space = this.themeName === "space";
    ctx.fillStyle = space ? "rgba(5,5,25,0.82)" : "rgba(248,243,228,0.9)";
    ctx.fillRect(0, 0, LOGICAL_W, viewH);

    ctx.save();
    ctx.translate(LOGICAL_W / 2, viewH * 0.26);
    ctx.rotate(-0.04);
    ctx.font = "bold 46px " + HAND;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillStyle = titleColor;
    ctx.fillText(title, 0, 0);
    ctx.restore();

    ctx.font = "22px " + HAND;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    let y = viewH * 0.38;
    for (const [text, color] of lines) {
      ctx.fillStyle = color;
      ctx.fillText(text, LOGICAL_W / 2, y);
      y += 34;
    }

    this.uiButtons = buttons;
    for (const b of buttons) drawOvalButton(ctx, b);
  },

  draw() {
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    if (this.shake > 0) {
      ctx.translate(rand(-1, 1) * this.shake * 14, rand(-1, 1) * this.shake * 14);
    }

    if (this.state === STATE.START) {
      this.drawMenu();
      return;
    }

    this.drawBackground();
    for (const p of this.platforms) p.draw(ctx, this.camY);
    for (const m of this.monsters)  m.draw(ctx, this.camY);
    for (const pa of this.particles) pa.draw(ctx, this.camY);
    this.player.draw(ctx, this.camY);
    this.drawHUD();

    const space = this.themeName === "space";
    if (this.state === STATE.PAUSED) {
      this.drawOverlay("pause", space ? "#cfe8ff" : "#2e2a20",
        [["Tippen oder P zum Weiterspielen", space ? "#8fa8c8" : "#6b6353"]],
        []);
    } else if (this.state === STATE.GAMEOVER) {
      const recordLine = this.score >= this.best
        ? ["Neuer Rekord!", "#3f9a1e"]
        : ["Rekord: " + this.best, space ? "#8fa8c8" : "#6b6353"];
      this.drawOverlay("game over!", "#c0392b",
        [["Punkte: " + this.score, space ? "#cfe8ff" : "#2e2a20"], recordLine],
        [
          { id: "again", label: "nochmal", x: LOGICAL_W / 2, y: viewH * 0.58, w: 210, h: 62, rot: -0.03, space },
          { id: "menu",  label: "menü",   x: LOGICAL_W / 2, y: viewH * 0.71, w: 180, h: 58, rot: 0.03, space },
        ]);
    }
  },
};

/* ------------------------------ Game-Loop ------------------------------- */

let lastTime = performance.now();

function frame(now) {
  let dt = (now - lastTime) / 1000;
  lastTime = now;
  dt = Math.min(dt, 1 / 30);          // Tab-Wechsel: keine Riesensprünge
  nowSec = now / 1000;

  if (game.state === STATE.PLAYING) {
    game.update(dt);
  }
  game.draw();

  requestAnimationFrame(frame);
}

document.addEventListener("visibilitychange", () => {
  if (document.hidden && game.state === STATE.PLAYING) game.state = STATE.PAUSED;
});

game.reset();
game.state = STATE.START;
requestAnimationFrame(frame);
</script>
</body>
</html>
